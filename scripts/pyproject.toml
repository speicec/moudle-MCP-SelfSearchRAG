[project]
name = "ocr-service"
version = "0.1.0"
description = "PaddleOCR Layout Analysis HTTP Service"
requires-python = ">=3.10,<3.13"
dependencies = [
    "paddlepaddle>=2.5.0",
    "paddleocr>=2.7.0",
    "paddlex[ocr]>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"